{% extends "base.html" %}

{% block title %}Main{% endblock title %}


{% block body %}

<div class="container mt-5">
    <h1 class="mb-4">Cocktail Liste</h1>
    <div class="row">
        {% for cocktail in cocktails %}
        <div class="col-md-4 mb-4">
            <div class="card bg-dark ">
                <a href="/cocktail/{{cocktail['mixturesID']}}" class="text-decoration-none">
                <img src="https://via.placeholder.com/150" class="card-img-top" alt="{{cocktail['name']}}">
                <div class="card-body">
                    <h5 class="card-title text-light">{{cocktail['name']}}</h5>
                    <p class="card-text text-light">{{cocktail['description']}}</p>
                </div>
                </a>
            </div>
        </div>
        {% endfor %}
    </div>
</div>


{% endblock body %}


{% block script %}
{% endblock script %}
